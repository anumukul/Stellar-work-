repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Check Rust code formatting
        entry: cargo fmt --manifest-path contracts/escrow/Cargo.toml --all -- --check
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Lint Rust code
        entry: cargo clippy --manifest-path contracts/escrow/Cargo.toml --all-targets --all-features -- -D warnings
        language: system
        files: \.rs$
        pass_filenames: false

      - id: frontend-lint
        name: frontend lint
        description: Lint frontend code
        entry: npm run lint --prefix frontend
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false

      - id: tokenomics-docs
        name: tokenomics docs consistency
        description: Verify docs/TOKENOMICS.md constants match the contract and frontend mirrors
        entry: python3 scripts/check-tokenomics-docs.py
        language: system
        files: ^(docs/TOKENOMICS\.md|contracts/escrow/src/lib\.rs|frontend/lib/transactions\.ts|frontend/app/fee-calculator/page\.tsx)$
        pass_filenames: false