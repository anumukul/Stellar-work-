name: Lighthouse CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/lighthouse.yml'
      - '.lighthouserc.json'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/lighthouse.yml'
      - '.lighthouserc.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Performance Budget
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHSQ
      NEXT_PUBLIC_NETWORK: testnet

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: lighthouse-results/
          retention-days: 30

      - name: Comment PR with Lighthouse scores
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsPath = 'lighthouse-results/manifest.json';
            if (!fs.existsSync(resultsPath)) {
              console.log('No Lighthouse results found');
              return;
            }
            const manifest = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
            let body = '## Lighthouse Report\n\n';
            for (const [url, report] of Object.entries(manifest)) {
              const summary = report.summary;
              body += `### ${url}\n`;
              body += `| Metric | Score |\n|---|---|\n`;
              body += `| Performance | ${(summary.performance * 100).toFixed(0)}/100 |\n`;
              body += `| Accessibility | ${(summary.accessibility * 100).toFixed(0)}/100 |\n`;
              body += `| LCP | ${summary.lcp?.toFixed(0)}ms |\n`;
              body += `| CLS | ${summary.cls?.toFixed(3)} |\n`;
              body += '\n';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
