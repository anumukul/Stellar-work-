name: Contract tests

on:
  push:
    paths:
      - 'contracts/**'
  pull_request:
    paths:
      - 'contracts/**'

jobs:
  contract-tests:
    name: Run contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Rust
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.6
        with:
          toolchain: stable
          components: clippy, rustfmt
          profile: minimal

      - name: Install cargo-tarpaulin
        run: |
          cargo install cargo-tarpaulin --locked || true

      - name: Run cargo tests (capture output)
        id: run_tests
        run: |
          set -e
          mkdir -p test-logs
          if [ -f contracts/Cargo.toml ]; then
            cd contracts
            cargo test --workspace --tests --all-features 2>&1 | tee ../test-logs/test-output.txt || true
            cd ..
          else
            cargo test --workspace --tests --all-features 2>&1 | tee test-logs/test-output.txt || true
          fi
          # Default to success unless output shows failures
          if grep -E "test result: .*FAILED|\bfailed\b" test-logs/test-output.txt >/dev/null 2>&1; then
            echo "tests_status=failed" >> $GITHUB_OUTPUT
          else
            echo "tests_status=success" >> $GITHUB_OUTPUT
          fi

      - name: Generate coverage report
        if: always()
        run: |
          mkdir -p coverage
          if command -v cargo-tarpaulin >/dev/null 2>&1; then
            if [ -f contracts/Cargo.toml ]; then
              (cd contracts && cargo tarpaulin -o Xml --output-dir ../coverage) || true
            else
              cargo tarpaulin -o Xml --output-dir coverage || true
            fi
          else
            echo "cargo-tarpaulin not installed; skipping coverage" > coverage/README.txt
          fi

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: contract-test-logs
          path: test-logs

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: contract-coverage
          path: coverage

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const status = '${{ steps.run_tests.outputs.tests_status }}' || 'unknown';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = `Contract tests **${status.toUpperCase()}** — [View run logs](${runUrl})`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

      - name: Fail job on test failures
        if: steps.run_tests.outputs.tests_status == 'failed'
        run: |
          echo "One or more contract tests failed."
          exit 1
