name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-preview.yml'

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# ── Permissions ───────────────────────────────────────────────────────────────
# Minimal baseline. Preview deployments run on pull requests, including those
# from forks. id-token: write is intentionally absent at workflow level and
# added only to the deploy-preview job.
#
# Note on fork PRs: GitHub does not issue OIDC tokens for workflows triggered
# by pull_request events from forks when the forked repo is not trusted. In
# that case the configure-aws-credentials step will be skipped gracefully —
# preview deployments from forks go to Vercel only, which is fine because
# VERCEL_TOKEN is a project-scoped secret and the environment gate is not set
# for the preview environment.
permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    name: Deploy Preview
    runs-on: ubuntu-latest
    environment: preview

    permissions:
      contents: read
      pull-requests: write
      # id-token: write issued only here so the plan/read-only role can be
      # assumed for any AWS introspection a preview build might need.
      id-token: write

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_CONTRACT_ID: ${{ secrets.SOROBAN_CONTRACT_ID }}
      NEXT_PUBLIC_NETWORK: testnet
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG || 'stellarwork' }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'stellarwork-frontend' }}
      SENTRY_RELEASE: ${{ github.sha }}
      NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # ── AWS access via OIDC (read-only plan role) ──────────────────────────
      # Preview deployments only need read access to AWS (e.g. to resolve
      # resource ARNs or verify config). The plan role has ReadOnlyAccess.
      # This step is skipped for fork PRs — GitHub does not issue OIDC tokens
      # to untrusted fork workflows and configure-aws-credentials will fail
      # gracefully when the secret is absent.
      - name: Configure AWS credentials (OIDC)
        if: vars.TERRAFORM_PLAN_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: deploy-preview-${{ github.run_id }}
          role-duration-seconds: 1800

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_NETWORK: testnet
          NEXT_PUBLIC_SOROBAN_RPC: https://soroban-testnet.stellar.org

      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_NETWORK: testnet
          NEXT_PUBLIC_SOROBAN_RPC: https://soroban-testnet.stellar.org

      - name: Comment preview URL on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        with:
          script: |
            const deployUrl = '${{ steps.deploy.outputs.url }}';
            const body = [
              '## 🚀 Preview Deployment',
              '',
              `Preview URL: **${deployUrl}**`,
              '',
              '| Field | Value |',
              '|---|---|',
              `| Branch | \`${{ github.head_ref }}\` |`,
              `| Commit | \`${{ github.event.pull_request.head.sha }}\` |`,
              `| Status | ✅ Deployed |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('🚀 Preview Deployment')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  remove-preview:
    if: github.event.action == 'closed'
    name: Remove Preview
    runs-on: ubuntu-latest

    # No AWS access needed for teardown — Vercel cleanup only.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Get Preview URL from PR comment
        id: get_url
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('🚀 Preview Deployment')
            );
            if (existing) {
              const match = existing.body.match(/Preview URL: \*\*(https:\/\/[^*]+)\*\*/);
              if (match) core.setOutput('url', match[1]);
            }

      - name: Remove Vercel deployment
        if: steps.get_url.outputs.url != ''
        run: vercel rm ${{ steps.get_url.outputs.url }} --token=${{ secrets.VERCEL_TOKEN }} --yes
