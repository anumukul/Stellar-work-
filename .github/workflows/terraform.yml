name: "Terraform CI/CD"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

# ── Permissions ───────────────────────────────────────────────────────────────
# Declared at workflow level as the most-restrictive baseline.
# The apply job overrides with id-token: write so it alone can request an
# OIDC token from GitHub's IdP — plan and format jobs never receive one.
permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Format & validate (no cloud access needed) ──────────────────────────────
  validate:
    name: "Format & Validate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.6.0

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: ./terraform

  # ── Plan (read-only OIDC role, PR events only) ───────────────────────────────
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: validate

    permissions:
      contents: read
      pull-requests: write
      # id-token: write is required to exchange the GitHub OIDC JWT for
      # temporary AWS credentials via sts:AssumeRoleWithWebIdentity.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.6.0

      # Exchanges the GitHub OIDC JWT for short-lived AWS credentials scoped to
      # the plan role (ReadOnlyAccess). No static keys involved.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          # 30-minute session is ample for plan; shorter is better.
          role-session-name: terraform-plan-${{ github.run_id }}
          role-duration-seconds: 1800

      - name: Terraform Init
        id: init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: ./terraform

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color \
            -var-file="environments/staging/terraform.tfvars" \
            2>&1 | tee /tmp/plan-output.txt
          # Capture exit code separately so continue-on-error still records it.
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        working-directory: ./terraform
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        env:
          PLAN_OUTPUT: ${{ steps.plan.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let planText = '';
            try {
              planText = fs.readFileSync('/tmp/plan-output.txt', 'utf8').slice(0, 60000);
            } catch (_) {}

            const output = [
              '#### Terraform Format 🖌 `${{ steps.fmt.outcome }}`',
              '#### Terraform Init ⚙️ `${{ steps.init.outcome }}`',
              '#### Terraform Validate 🤖 `${{ steps.validate.outcome }}`',
              '#### Terraform Plan 📖 `${{ steps.plan.outcome }}`',
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```hcl',
              planText,
              '```',
              '</details>',
              '',
              `*Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('Terraform Plan')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: output,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output,
              });
            }

      - name: Fail on plan error
        if: steps.plan.outputs.exit_code != '0'
        run: exit 1

  # ── Apply (write OIDC role, main branch push, protected environment) ─────────
  apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate
    # The 'production' environment must be configured in Settings → Environments
    # with at least one required reviewer. GitHub will pause the job here and
    # wait for approval before issuing the OIDC token, which means the apply
    # role's trust policy (scoped to this environment claim) rejects any attempt
    # to skip the gate by forging or replaying a token.
    environment: production

    permissions:
      contents: read
      # id-token: write is intentionally absent from the workflow-level
      # permissions block and added only here — the plan job never receives
      # a token that could be used to assume the write role.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.6.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: terraform-apply-${{ github.run_id }}
          role-duration-seconds: 3600

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Apply
        run: |
          terraform apply \
            -auto-approve \
            -var-file="environments/prod/terraform.tfvars"
        working-directory: ./terraform
