name: Container Image Scan

on:
  push:
    branches: [main]
    paths:
      - 'frontend/Dockerfile'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'docker-compose.yml'
      - '.env.docker'
      - '.github/workflows/container-scan.yml'
      - '.github/container-scan-allowlist.json'
      - '.github/scripts/check-trivy-allowlist.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/Dockerfile'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'docker-compose.yml'
      - '.env.docker'
      - '.github/workflows/container-scan.yml'
      - '.github/container-scan-allowlist.json'
      - '.github/scripts/check-trivy-allowlist.mjs'

permissions:
  contents: read
  security-events: write  # required to upload SARIF to the Security tab
  pull-requests: write    # required to post findings as a PR comment

concurrency:
  group: container-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Build & Scan Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      # Build only the production runner stage so we scan the actual artefact
      # that would be shipped, not the intermediate builder layer.
      - name: Build production image
        id: build
        run: |
          docker build \
            --target runner \
            --tag stellarwork-frontend:scan-${{ github.sha }} \
            ./frontend

      # ── Trivy scan — JSON output for allowlist enforcement ────────────────
      # Produces a machine-readable report used by the allowlist script.
      # Exit code 0 always so the step itself doesn't fail; the script below
      # applies the gate with proper allowlist awareness.
      - name: Run Trivy (JSON report)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: stellarwork-frontend:scan-${{ github.sha }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          # Scan OS packages and language-level dependencies inside the image.
          vuln-type: os,library
          # Ignore unfixed CVEs — they cannot be remediated by upgrading the
          # base image and would produce permanent noise.
          ignore-unfixed: true
          exit-code: '0'

      # ── Allowlist enforcement ─────────────────────────────────────────────
      # Fails the job if any CRITICAL/HIGH finding is not in the allowlist or
      # if any allowlist entry has expired.
      - name: Enforce allowlist
        run: |
          node .github/scripts/check-trivy-allowlist.mjs \
            --input trivy-results.json \
            --allowlist .github/container-scan-allowlist.json

      # ── SARIF upload — Security tab ───────────────────────────────────────
      # Always runs (even on allowlist failure) so findings are visible in the
      # repository Security → Code scanning alerts view regardless of outcome.
      - name: Run Trivy (SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: stellarwork-frontend:scan-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          sarif_file: trivy-results.sarif
          category: container-image

      # ── Artifact retention ────────────────────────────────────────────────
      # Keep the raw JSON report for 30 days so engineers can inspect it
      # without re-running the scan.
      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: trivy-container-scan-${{ github.sha }}
          path: trivy-results.json
          retention-days: 30

      # ── Critical-finding notification ─────────────────────────────────────
      # Posts a PR comment when new CRITICAL findings are present that are not
      # in the allowlist. This gives reviewers immediate visibility without
      # requiring them to navigate to the Actions log.
      - name: Post PR comment on critical findings
        if: >
          failure() &&
          github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        with:
          script: |
            const fs = require('fs');
            let findings = [];
            try {
              const raw = JSON.parse(fs.readFileSync('trivy-results.json', 'utf8'));
              for (const result of raw.Results ?? []) {
                for (const vuln of result.Vulnerabilities ?? []) {
                  if (vuln.Severity === 'CRITICAL') {
                    findings.push(
                      `| \`${vuln.VulnerabilityID}\` | \`${vuln.PkgName}\` | ${vuln.InstalledVersion} | ${vuln.FixedVersion ?? '—'} |`
                    );
                  }
                }
              }
            } catch (e) {
              core.warning(`Could not parse trivy-results.json: ${e.message}`);
            }

            const body = findings.length > 0
              ? [
                  '## 🚨 Container scan: CRITICAL vulnerabilities found',
                  '',
                  'The following **unapproved** CRITICAL findings block this PR.',
                  'Either upgrade the affected package, pin a fixed base-image digest,',
                  'or add an allowlist entry with justification and expiry.',
                  'See [SECURITY.md](../../blob/main/SECURITY.md#container-scanning) for the process.',
                  '',
                  '| CVE | Package | Installed | Fixed in |',
                  '|-----|---------|-----------|----------|',
                  ...findings,
                  '',
                  '_Full report available in the [Actions run](' +
                    `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) artifacts._`,
                ].join('\n')
              : [
                  '## ✅ Container scan: no unapproved critical findings',
                  '',
                  'All CRITICAL/HIGH findings are either fixed or covered by an allowlist entry.',
                ].join('\n');

            // Update existing bot comment if present, otherwise create a new one.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('Container scan')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
