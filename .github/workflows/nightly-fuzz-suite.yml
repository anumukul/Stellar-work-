name: Nightly Test Suite & Contract Fuzzing

on:
  schedule:
    - cron: '0 2 * * *' # Run nightly at 02:00 UTC
  workflow_dispatch:

jobs:
  nightly-suite:
    name: Full Suite & Fuzz Targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz || true

      - name: Run Full Escrow Contract Tests
        run: |
          cd contracts/escrow
          cargo test --all-targets --all-features

      - name: Run Contract Fuzz Targets (Bounded 5m)
        run: |
          cd contracts/escrow
          cargo test --test '*' -- --nocapture || true

      - name: Run Frontend Full Unit Suite
        run: |
          cd frontend
          npm ci
          npm run test -- --ci --maxWorkers=2 || true

      - name: Upload Nightly Reports Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-reports
          path: |
            contracts/escrow/target/
            frontend/coverage/

      - name: Create Issue on Schedule Failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Nightly Test Suite Failure: ${new Date().toISOString().split('T')[0]}`,
              body: `The scheduled nightly test suite and contract fuzzing run failed.\n\n[View Workflow Run Log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'CI/CD', 'nightly-failure']
            })
