global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    platform: stellarwork
    # Expanded from the ENVIRONMENT variable via --enable-feature=expand-external-labels.
    environment: ${ENVIRONMENT}

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Frontend app metrics: web vitals, page views, contract tx outcomes.
  - job_name: stellarwork-frontend
    metrics_path: /api/metrics
    scheme: http
    static_configs:
      - targets:
          - frontend:3000
        labels:
          service: frontend

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Host-level CPU/memory/disk. Optional: only up when the node-exporter
  # profile is enabled in docker-compose.monitoring.yml.
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  # Synthetic checks against public endpoints (health + Stellar RPC reachability).
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://frontend:3000/
        labels:
          probe: frontend-home
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
