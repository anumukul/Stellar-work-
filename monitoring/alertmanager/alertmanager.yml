global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by:
    - alertname
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    # Page immediately on anything that breaks the platform for users.
    - receiver: critical
      matchers:
        - severity = "critical"
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: default
    # Alertmanager does not expand environment variables. Replace the placeholder
    # below with the real webhook (or mount a file and use `api_url_file`).
    slack_configs:
      - api_url: https://hooks.slack.com/services/REPLACE/WITH/WEBHOOK
        channel: "#stellarwork-alerts"
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ if .Annotations.runbook_url }}Runbook: {{ .Annotations.runbook_url }}{{ end }}
          {{ end }}

  - name: critical
    slack_configs:
      - api_url: https://hooks.slack.com/services/REPLACE/WITH/WEBHOOK
        channel: "#stellarwork-incidents"
        send_resolved: true
        title: '[CRITICAL] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ if .Annotations.runbook_url }}Runbook: {{ .Annotations.runbook_url }}{{ end }}
          {{ end }}

inhibit_rules:
  # A down target explains the metric-derived alerts that follow it.
  - source_matchers:
      - alertname = "FrontendTargetDown"
    target_matchers:
      - severity = "warning"
    equal:
      - environment
